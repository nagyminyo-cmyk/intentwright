name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation tools
        run: python -m pip install ruff==0.15.22

      - name: Check syntax
        run: python -m py_compile scripts/goal_lifecycle.py

      - name: Check command-line interface
        run: python scripts/goal_lifecycle.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check .
