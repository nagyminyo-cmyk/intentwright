name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os, pathlib; version = pathlib.Path('VERSION').read_text().strip(); assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match VERSION'"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate release source
        run: |
          python -m pip install ruff==0.15.22
          ruff check .

      - name: Build clean packages
        run: python scripts/build_release.py --output-dir dist --include-source

      - name: Retain release assets for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: intentwright-release-packages
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download checked packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: intentwright-release-packages
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              printf '%s\n' 'Refusing to replace assets on a published release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes
          fi
